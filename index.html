<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>For Hanona ❤️</title>

<style>
body {
    text-align: center;
    background: linear-gradient(to right, #ffdde1, #ee9ca7);
    font-family: Arial;
    overflow: hidden;
    color: #333;
}

/* اهتزاز */
@keyframes shake {
    0% { transform: translate(0px, 0px); }
    25% { transform: translate(5px, -5px); }
    50% { transform: translate(-5px, 5px); }
    75% { transform: translate(5px, 5px); }
    100% { transform: translate(0px, 0px); }
}

/* القلوب */
.heart {
    position: fixed;
    bottom: -10px;
    animation: float 6s linear infinite;
}

@keyframes float {
    0% {transform: translateY(0);}
    100% {transform: translateY(-100vh);}
}

/* الأزرار */
button {
    padding: 12px 25px;
    font-size: 18px;
    margin: 10px;
    border-radius: 12px;
    border: none;
    cursor: pointer;
}

#yes { background: #ff4d6d; color: white; }
#no { background: #333; color: white; position: absolute; }

#content { display: none; margin-top: 50px; }

img {
    width: 200px;
    border-radius: 20px;
    margin: 10px;
    box-shadow: 0 0 15px rgba(0,0,0,0.2);
}
</style>
</head>

<body>

<div id="start">
    <h1>ادخلي بقى 😏❤️</h1>

    <button id="yes" onclick="enter()">افتحي يهانم 🙂❤️</button>

    <button id="no" onclick="moveBtn()" onmouseover="moveBtn()">
        لاااااااااا 😏
    </button>

    <p>مش هخليكي تخرجي 😂<br>فكري بس قبل متخرجي في حاجه حلوه جوه ❤️</p>
</div>

<div id="content">
    <h1>❤️ هنونه ❤️</h1>

    <p id="loveMsg"></p>

    <h2 id="timer"></h2>

    <div>
        <img src="photo1.jpg">
        <img src="photo2.jpg">
    </div>
</div>

<audio id="music" loop>
    <source src="song.mp3" type="audio/mp3">
</audio>

<script>

// الرسالة
let text = "sorrry ya hanona about anything 🥹❤️\nYou are the most beautiful thing in my life.\nAnd no matter what happens, I will always choose you ❤️";

let i = 0;
function typeWriter() {
    if (i < text.length) {
        document.getElementById("loveMsg").innerHTML += text.charAt(i);
        i++;
        setTimeout(typeWriter, 40);
    }
}

// الهروب
function moveBtn() {
    let btn = document.getElementById("no");

    let x = Math.random() * (window.innerWidth - btn.offsetWidth);
    let y = Math.random() * (window.innerHeight - btn.offsetHeight);

    btn.style.left = x + "px";
    btn.style.top = y + "px";
}

// الدخول
function enter() {
    document.getElementById("start").style.display = "none";
    document.getElementById("content").style.display = "block";

    document.body.style.animation = "shake 0.5s";

    document.getElementById("music").play();
    startHearts();
    typeWriter();
}

// القلوب
function startHearts() {
    setInterval(() => {
        let heart = document.createElement("div");
        heart.className = "heart";
        heart.innerHTML = "💗";
        heart.style.left = Math.random() * 100 + "vw";
        heart.style.fontSize = (Math.random() * 20 + 10) + "px";
        document.body.appendChild(heart);

        setTimeout(() => {
            heart.remove();
        }, 6000);
    }, 300);
}

// التايمر
let loveDate = new Date("2022-03-26");

function updateTimer() {
    let now = new Date();
    let diff = now - loveDate;

    let days = Math.floor(diff / (1000 * 60 * 60 * 24));
    let hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
    let minutes = Math.floor((diff / (1000 * 60)) % 60);

    document.getElementById("timer").innerHTML =
        "من 26/3/2022 عدّى " + days + " يوم ❤️";
}

setInterval(updateTimer, 1000);

</script>

</body>
</html>
